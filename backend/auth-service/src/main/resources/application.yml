server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_usuarios}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  agro-service:
    url: ${AGRO_SERVICE_URL:http://localhost:8082}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
