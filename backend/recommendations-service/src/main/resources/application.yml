spring:
  application:
    name: recommendations-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_recomendaciones}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        time_zone: America/Bogota

server:
  port: ${PORT:8083}
  servlet:
    context-path: /api

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
  agro-service:
    url: ${AGRO_SERVICE_URL:http://localhost:8082}
