server:
  port: ${PORT:9000}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        response-timeout: 90s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_ORIGIN:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: agro-admin-fincas
          uri: ${AGRO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/fincas/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/admin/**

        - id: agro-service
          uri: ${AGRO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/fincas/**,/api/cultivos/**,/api/parcelas/**,/api/dashboard/**,/api/parametros/**,/api/reportes/**,/api/sincronizacion/**,/api/sync/**,/api/supervisiones/**,/api/actividades/**

        - id: recommendations-service
          uri: ${RECOMMENDATIONS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/recomendaciones/**,/api/alertas/**

app:
  jwt:
    secret: ${JWT_SECRET}
